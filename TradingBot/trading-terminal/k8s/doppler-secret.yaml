# DopplerSecret — operator syncs Doppler project:trading-monk config:trading_terminal
# into k8s Secret "terminal-secrets" in the trading-terminal namespace.
# Pre-requisite: doppler-token-trading-terminal must exist (created by make doppler-setup).
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: terminal-secrets-sync
  namespace: trading-terminal
spec:
  tokenSecret:
    name: doppler-token-trading-terminal
  managedSecret:
    name: terminal-secrets
    namespace: trading-terminal
    type: Opaque
