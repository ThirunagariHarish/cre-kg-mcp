apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-terminal-backend
  namespace: trading-terminal
  labels:
    app: trading-terminal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-terminal-backend
  template:
    metadata:
      labels:
        app: trading-terminal-backend
    spec:
      containers:
        - name: backend
          image: localhost:5111/trading-terminal-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: terminal-config    # POSTGRES_URL, REDIS_URL, KAFKA_BOOTSTRAP_SERVERS, CORS_ORIGINS, ENVIRONMENT
            - secretRef:
                name: terminal-secrets   # Doppler: ALPACA_API_KEY, ALPACA_API_SECRET, ANTHROPIC_API_KEY, SECRET_KEY, DISCORD_TOKEN
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: trading-terminal-backend
  namespace: trading-terminal
spec:
  selector:
    app: trading-terminal-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
