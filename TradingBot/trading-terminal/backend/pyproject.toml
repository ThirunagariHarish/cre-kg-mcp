[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-terminal"
version = "1.0.0"
description = "Bloomberg-style AI-assisted Trading Terminal"
requires-python = ">=3.11"

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # ── Data Validation ──
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── Cache ──
    "redis>=5.0.0",

    # ── Message Bus ──
    "confluent-kafka>=2.4.0",

    # ── AI ──
    "anthropic>=0.29.0",

    # ── Discord ──
    "discord.py>=2.3.0",

    # ── Broker ──
    "alpaca-trade-api>=3.3.0",

    # ── Market Data ──
    "yfinance>=0.2.40",
    "pandas>=2.2.0",

    # ── Auth ──
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",

    # ── Utilities ──
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",

    # Linting / Formatting
    "ruff>=0.5.0",
    "mypy>=1.10.0",

    # Type stubs
    "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
