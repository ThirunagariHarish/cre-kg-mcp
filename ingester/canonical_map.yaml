# Canonical taxonomy mapping.
# Each top-level key is a taxonomy kind. Under it, the canonical form maps to a
# list of alias strings (lower-cased). Aliases are matched case-insensitively
# at runtime. Add new aliases freely; the resolver never errors on no-match —
# it logs a warning and keeps the raw value as the canonical name.

