# M2: Submarket canonicalization.
# Seeded from known variants observed in CRE_PROPERTIES / CRE_LEASE_COMPS.
# Pattern: canonical form (lowercase, hyphenated) → list of raw aliases.
# DFW submarkets sourced from CRE_PROPERTIES SUBMARKET column observations.
# NYC/Midtown/Downtown: standard broker market parlance.
# Common variant "DFW North - Urban" -> "dfw-north" aligns with market alias above.
