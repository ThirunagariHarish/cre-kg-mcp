name: Build → Push GHCR → Deploy k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/thirunagariharish/analyst-team

jobs:
  # ── 1. Build & push image (GitHub-hosted, needs Docker) ───────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Classic PAT with write:packages scope stored as GHCR_TOKEN secret.
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy on the self-hosted runner (runs ON VPS2, no inbound SSH) ────
  deploy:
    name: Deploy to k3s
    needs: build-push
    # Runs directly on VPS2 — kubectl/kustomize are already available locally.
    # Hostinger blocks inbound SSH from GitHub-hosted runners (Azure IPs).
    runs-on: [self-hosted, vps2]

    steps:
      - uses: actions/checkout@v4

      - name: Pull manifests, update image tag, apply
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
        run: |
          set -e

          # Ensure kustomize is present (idempotent)
          if ! command -v kustomize &>/dev/null; then
            sudo curl -sL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz \
              | sudo tar xz -C /usr/local/bin kustomize
          fi

          DEPLOY_DIR=/home/ghrunner/analyst-team-deploy
          # Trust the deploy dir regardless of who owns it
          git config --global --add safe.directory "$DEPLOY_DIR"
          if [ -d "$DEPLOY_DIR/.git" ]; then
            cd "$DEPLOY_DIR" && git pull --ff-only
          else
            git clone git@github-analyst-team:ThirunagariHarish/AnalystTeam.git "$DEPLOY_DIR"
            git config --global --add safe.directory "$DEPLOY_DIR"
          fi
          cd "$DEPLOY_DIR/k8s/analyst-team"
          kustomize edit set image ghcr.io/thirunagariharish/analyst-team=ghcr.io/thirunagariharish/analyst-team:$IMAGE_TAG
          cd ../..
          kubectl apply -k k8s/analyst-team/
          kubectl rollout status deployment/analyst-team-dashboard -n analyst-team --timeout=180s
          kubectl rollout status deployment/analyst-team-bot -n analyst-team --timeout=180s
          echo "=== Deployed: $IMAGE_TAG ==="
          kubectl get pods -n analyst-team
          kubectl get ingress -n analyst-team

      - name: Smoke test
        run: |
          sleep 15
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 15 https://analystteam.cashflowus.com/api/health 2>/dev/null || echo 000)
          echo "Dashboard /api/health → $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Live" || echo "⚠️  Check dashboard"
