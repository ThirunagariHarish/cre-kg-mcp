name: Build → Push GHCR → Deploy k3s

on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/thirunagariharish/analyst-team

jobs:
  # ── 1. Build & push image ──────────────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy to k3s via SSH ───────────────────────────────────────────────
  deploy:
    name: Deploy to k3s
    needs: build-push
    runs-on: ubuntu-latest
    environment: production     # requires environment approval if configured

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.VPS_HOST }}          # GitHub variable: 2.25.157.104
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}     # GitHub secret: private key for VPS2
          port: 22
          timeout: 120s
          script: |
            set -e

            # ── Ensure namespace exists ──────────────────────────────
            kubectl create namespace analyst-team --dry-run=client -o yaml \
              | kubectl apply -f -

            # ── Pull latest manifests from GitHub ───────────────────
            DEPLOY_DIR="/opt/analyst-team-deploy"
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR" && git pull --ff-only
            else
              git clone https://github.com/ThirunagariHarish/AnalystTeam.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            # ── Pin exact image SHA for this deploy ──────────────────
            cd k8s/analyst-team
            kustomize edit set image \
              ghcr.io/thirunagariharish/analyst-team=ghcr.io/thirunagariharish/analyst-team:${{ needs.build-push.outputs.image_tag }}
            cd ../..

            # ── Apply all manifests ──────────────────────────────────
            kubectl apply -k k8s/analyst-team/

            # ── Roll out & wait ──────────────────────────────────────
            kubectl rollout status deployment/analyst-team-dashboard \
              -n analyst-team --timeout=180s
            kubectl rollout status deployment/analyst-team-bot \
              -n analyst-team --timeout=180s

            echo ""
            echo "=== Deployed: ${{ needs.build-push.outputs.image_tag }} ==="
            kubectl get pods -n analyst-team
            kubectl get ingress -n analyst-team

      - name: Smoke test dashboard
        run: |
          echo "Waiting 15s for ingress to route..."
          sleep 15
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 10 \
            https://analystteam.cashflowus.com/api/health || echo "000")
          echo "Dashboard /api/health returned: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Dashboard is live"
          else
            echo "⚠️  Dashboard not yet responding (DNS may still be propagating)"
          fi
