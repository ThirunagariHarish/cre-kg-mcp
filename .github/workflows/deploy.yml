name: Build → Push GHCR → Deploy k3s

on:
  push:
    branches: [main]
  workflow_dispatch:          # allow manual trigger from GitHub UI

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/thirunagariharish/analyst-team

jobs:
  # ── 1. Build & push image ──────────────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # needed to push to GHCR

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Bootstrap secrets on VPS (idempotent) ──────────────────────────────
  bootstrap-secrets:
    name: Bootstrap k8s Secrets
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      # Pass Doppler token via stdin — never appears in process list or shell history
      - name: Create doppler-token-secret (idempotent)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
        run: |
          echo "$DOPPLER_TOKEN" | ssh -o StrictHostKeyChecking=no root@${{ vars.VPS_HOST }} \
            "kubectl create secret generic doppler-token-secret \
               --from-literal=serviceToken=\$(cat) \
               -n analyst-team \
               --dry-run=client -o yaml | kubectl apply -f -"

  # ── 3. Deploy to k3s via SSH ───────────────────────────────────────────────
  deploy:
    name: Deploy to k3s
    needs: [build-push, bootstrap-secrets]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 180s
          script: |
            set -e

            # ── Ensure namespace exists ──────────────────────────────
            kubectl create namespace analyst-team --dry-run=client -o yaml \
              | kubectl apply -f -

            # ── Pull latest manifests from GitHub ───────────────────
            DEPLOY_DIR="/opt/analyst-team-deploy"
            if [ -d "$DEPLOY_DIR/.git" ]; then
              cd "$DEPLOY_DIR" && git pull --ff-only
            else
              git clone https://github.com/ThirunagariHarish/AnalystTeam.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            # ── Pin exact image SHA for this deploy ──────────────────
            IMAGE_TAG="${{ needs.build-push.outputs.image_tag }}"
            cd k8s/analyst-team
            kustomize edit set image \
              "ghcr.io/thirunagariharish/analyst-team=ghcr.io/thirunagariharish/analyst-team:${IMAGE_TAG}"
            cd ../..

            # ── Apply all manifests ──────────────────────────────────
            kubectl apply -k k8s/analyst-team/

            # ── Roll out & wait ──────────────────────────────────────
            kubectl rollout status deployment/analyst-team-dashboard \
              -n analyst-team --timeout=180s
            kubectl rollout status deployment/analyst-team-bot \
              -n analyst-team --timeout=180s

            echo ""
            echo "=== ✅ Deployed: ${IMAGE_TAG} ==="
            kubectl get pods -n analyst-team
            kubectl get ingress -n analyst-team

      - name: Smoke test dashboard
        run: |
          sleep 20
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 15 \
            https://analystteam.cashflowus.com/api/health 2>/dev/null || echo "000")
          echo "Dashboard /api/health → $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Dashboard is live at https://analystteam.cashflowus.com"
          else
            echo "⚠️  Not yet responding — DNS may still be propagating (check in 5 min)"
          fi
