name: Build → Push GHCR → Deploy k3s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/thirunagariharish/analyst-team

jobs:
  # ── 1. Build & push image ──────────────────────────────────────────────────
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Classic PAT with write:packages scope stored as GHCR_TOKEN secret.
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Bootstrap secrets (idempotent) ─────────────────────────────────────
  bootstrap-secrets:
    name: Bootstrap k8s Secrets
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Create doppler-token-secret (idempotent, token via stdin)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_SERVICE_TOKEN }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          echo "$DOPPLER_TOKEN" | ssh -o StrictHostKeyChecking=no root@$VPS_HOST \
            "kubectl create namespace analyst-team --dry-run=client -o yaml | kubectl apply -f - && \
             kubectl create secret generic doppler-token-secret \
               --from-literal=serviceToken=\$(cat) \
               -n analyst-team \
               --dry-run=client -o yaml | kubectl apply -f -"

  # ── 3. Deploy to k3s ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to k3s
    needs: [build-push, bootstrap-secrets]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Install deploy key for repo clone on VPS2
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          echo "$DEPLOY_KEY" | ssh -o StrictHostKeyChecking=no root@$VPS_HOST \
            "mkdir -p /root/.ssh && chmod 700 /root/.ssh
             cat > /root/.ssh/analyst_team_deploy
             chmod 600 /root/.ssh/analyst_team_deploy
             grep -q 'github-analyst-team' /root/.ssh/config 2>/dev/null || \
               printf 'Host github-analyst-team\n  HostName github.com\n  User git\n  IdentityFile /root/.ssh/analyst_team_deploy\n  StrictHostKeyChecking no\n' \
               >> /root/.ssh/config"

      - name: Pull manifests, update image tag, apply
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          VPS_HOST: ${{ vars.VPS_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$VPS_HOST "
            set -e
            DEPLOY_DIR=/opt/analyst-team-deploy
            if [ -d \$DEPLOY_DIR/.git ]; then
              cd \$DEPLOY_DIR && git pull --ff-only
            else
              git clone git@github-analyst-team:ThirunagariHarish/AnalystTeam.git \$DEPLOY_DIR
            fi
            cd \$DEPLOY_DIR/k8s/analyst-team
            kustomize edit set image ghcr.io/thirunagariharish/analyst-team=ghcr.io/thirunagariharish/analyst-team:$IMAGE_TAG
            cd ../..
            kubectl apply -k k8s/analyst-team/
            kubectl rollout status deployment/analyst-team-dashboard -n analyst-team --timeout=180s
            kubectl rollout status deployment/analyst-team-bot -n analyst-team --timeout=180s
            echo '=== Deployed: $IMAGE_TAG ==='
            kubectl get pods -n analyst-team
            kubectl get ingress -n analyst-team
          "

      - name: Smoke test
        run: |
          sleep 20
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 15 https://analystteam.cashflowus.com/api/health 2>/dev/null || echo 000)
          echo "Dashboard /api/health → $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Live" || echo "⚠️  DNS not yet propagated — check in 5 min"
