apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trading

resources:
- deployment.yaml
- configmap.yaml

# Image tag can be overridden per environment:
#   kustomize edit set image analyst-team=analyst-team:v1.2.3
images:
- name: analyst-team
  newTag: latest

commonLabels:
  app.kubernetes.io/name: analyst-team
  app.kubernetes.io/part-of: trading-bot
  app.kubernetes.io/managed-by: kustomize
