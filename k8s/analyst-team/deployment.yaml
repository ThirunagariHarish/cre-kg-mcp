apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst-team
  namespace: trading
  labels:
    app: analyst-team
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyst-team
  template:
    metadata:
      labels:
        app: analyst-team
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: analyst-team
        image: analyst-team:latest
        command: ["python", "scripts/run_all_analysts.py"]
        ports:
        - containerPort: 8080
          name: dashboard
          protocol: TCP
        envFrom:
        - secretRef:
            name: analyst-team-secrets
        - configMapRef:
            name: analyst-team-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        volumeMounts:
        - name: shared-state
          mountPath: /app/shared/state
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 2
      volumes:
      - name: shared-state
        persistentVolumeClaim:
          claimName: analyst-team-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analyst-team-state
  namespace: trading
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: analyst-team
  namespace: trading
  labels:
    app: analyst-team
spec:
  selector:
    app: analyst-team
  ports:
  - name: dashboard
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
