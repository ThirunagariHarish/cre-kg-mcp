# ── Dashboard deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst-team-dashboard
  namespace: analyst-team
  labels:
    app: analyst-team-dashboard
    app.kubernetes.io/name: analyst-team
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyst-team-dashboard
  template:
    metadata:
      labels:
        app: analyst-team-dashboard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8765"
        prometheus.io/path: "/api/health"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: dashboard
          image: ghcr.io/thirunagariharish/analyst-team:latest
          command:
            - python
            - -m
            - uvicorn
            - gateway.dashboard:app
            - --host
            - "0.0.0.0"
            - --port
            - "8765"
            - --workers
            - "1"
          ports:
            - name: http
              containerPort: 8765
          envFrom:
            - configMapRef:
                name: analyst-team-config
            - secretRef:
                name: analyst-team-credentials
                optional: true
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8765
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 2
          volumeMounts:
            - name: state
              mountPath: /app/shared/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: analyst-team-state
---
# ── Bot deployment (analysts + monitor) ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyst-team-bot
  namespace: analyst-team
  labels:
    app: analyst-team-bot
    app.kubernetes.io/name: analyst-team
    app.kubernetes.io/component: bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyst-team-bot
  template:
    metadata:
      labels:
        app: analyst-team-bot
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: bot
          image: ghcr.io/thirunagariharish/analyst-team:latest
          command:
            - python
            - scripts/run_all_analysts.py
          envFrom:
            - configMapRef:
                name: analyst-team-config
            - secretRef:
                name: analyst-team-credentials
                optional: true
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: 2000m
          volumeMounts:
            - name: state
              mountPath: /app/shared/state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: analyst-team-state
---
# ── Shared PVC (both pods mount the same state dir) ───────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analyst-team-state
  namespace: analyst-team
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
# ── Dashboard service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: analyst-team-dashboard
  namespace: analyst-team
  labels:
    app: analyst-team-dashboard
spec:
  selector:
    app: analyst-team-dashboard
  ports:
    - name: http
      port: 8765
      targetPort: 8765
