[project]
name = "cre-kg-mcp"
version = "1.0.0+hackathon"
description = "CRE Ontology Knowledge Graph MCP Server — Hackathon v1.0.0"
requires-python = ">=3.11"
dependencies = [
    "snowflake-connector-python>=3.12.0",
    "neo4j>=5.20.0,<6.0.0",
    "mcp>=1.0.0,<2.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "apscheduler>=3.10.4",
    "sentence-transformers>=3.0.0,<4.0.0",
    "graphdatascience>=1.8,<1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "testcontainers[neo4j]>=4.7.0",
]

[project.scripts]
cre-backfill = "ingester.backfill:main"
cre-mcp = "mcp_server.server:main"
cre-ingest = "ingester.streaming:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingester", "mcp_server", "ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Docker (deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "bcrypt>=5.0.0",
]
